import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def runTimeConfig = rootProject.file("../.runtime.config.json")
def config = [id: "com.bhoos.shell.default", displayName: "RN Shell", marketingVersion: "0.1", buildNumber: 1]
if (runTimeConfig.exists()) {
  def runTime = new JsonSlurper().parseText(runTimeConfig.text)
  config.id = runTime.id ?: config.id
  config.displayName = runTime.displayName ?: config.displayName
  config.marketingVersion = runTime.version ?: config.marketingVersion
  config.buildNumber = runTime.buildNumber ?: config.buildNumber
  config.deepLink = runTime.deepLink ?: ''
  // universalLink is either the domain or an object { domain, paths }
  def universalLink = runTime.universalLink
  config.universalLink = (universalLink instanceof Map ? universalLink.domain : universalLink) ?: ''
  config.permissions = runTime.permissions ?: [:]
  config.kiosk = runTime.kiosk ?: [:]
  config.updates = runTime.updates ?: [:]
  config.runtimeVersion = runTime.runtimeVersion?.android ?: ''
}

println "Runtime Configuration"
println config

/**
 * Permissions (see scripts/generatePermissions.js)
 * Manifest placeholders can't add elements, so a manifest overlay is generated with
 * a <uses-permission> for every requested permission and a tools:node="remove" for
 * every other permission listed in permissions.manifest.json. The overlay is attached
 * to the build type source sets, so the manifest merger gives it priority over the
 * main manifest and the libraries.
 */
def permissionsManifest = layout.buildDirectory.file("generated/rnshell/permissions/AndroidManifest.xml").get().asFile
def generatePermissionsManifest = {
  def manifest = new JsonSlurper().parseText(rootProject.file("../scripts/permissions.manifest.json").text)
  def requested = config.permissions ?: [:]

  requested.keySet().each { name ->
    if (!manifest.containsKey(name)) {
      throw new GradleException("Unknown permission \"${name}\". Available permissions: ${manifest.keySet().join(', ')}")
    }
  }

  def entries = []
  manifest.each { name, keys ->
    def androidKeys = keys.android instanceof List ? keys.android : (keys.android ? [keys.android] : [])
    def value = requested[name]
    def enabled = value != null && value != false
    androidKeys.each { key ->
      if (enabled) {
        println "Adding permission ${name} (${key})"
        entries << "  <uses-permission android:name=\"${key}\" />"
      } else {
        entries << "  <uses-permission android:name=\"${key}\" tools:node=\"remove\" />"
      }
    }
  }

  permissionsManifest.parentFile.mkdirs()
  permissionsManifest.text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by rn-shell from permissions.manifest.json, do not edit -->
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
  xmlns:tools="http://schemas.android.com/tools">
${entries.join('\n')}
</manifest>
"""
}
generatePermissionsManifest()


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.reactnativeshell"

    // Merge the generated permissions manifest into every build type
    sourceSets.configureEach { sourceSet ->
        if (buildTypes.findByName(sourceSet.name)) {
            sourceSet.manifest.srcFile permissionsManifest
        }
    }

    defaultConfig {
        manifestPlaceholders["displayName"] = config.displayName
        manifestPlaceholders["deepLink"] = config.deepLink
        manifestPlaceholders["universalLink"] = config.universalLink

        // Kiosk mode, applied in MainActivity
        buildConfigField "boolean", "KIOSK_FULL_SCREEN", String.valueOf(config.kiosk?.fullScreen == true)
        buildConfigField "boolean", "KIOSK_KEEP_AWAKE", String.valueOf(config.kiosk?.keepAwake == true)

        // Over the air updates (native/updates): where, the publisher's key, the builds
        // an update can run on, and when this one was made (older updates are skipped)
        resValue "string", "rn_shell_updates_url", config.updates?.url ?: ''
        resValue "string", "rn_shell_updates_key", config.updates?.publicKey ?: ''
        resValue "string", "rn_shell_runtime_version", config.runtimeVersion ?: ''
        resValue "string", "rn_shell_embedded_id", String.valueOf(System.currentTimeMillis())

        applicationId config.id
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode config.buildNumber
        versionName config.marketingVersion
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
